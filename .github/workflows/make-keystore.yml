name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore meekeyboard.keystore \
            -alias meekeyboard \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass meeinnovations2026 \
            -keypass meeinnovations2026 \
            -dname "CN=mee Innovations, OU=meeKeyboard, O=mee Innovations, L=Dhaka, S=Dhaka, C=BD"

      - name: Encode to base64
        run: |
          base64 -w 0 meekeyboard.keystore > keystore.b64
          echo "=== BASE64 START ==="
          cat keystore.b64
          echo ""
          echo "=== BASE64 END ==="
          echo "Length: $(wc -c < keystore.b64) chars"

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-files
          path: |
            meekeyboard.keystore
            keystore.b64
